<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30">
  <defs>
    <clipPath id="uk-clip-border">
      <rect width="60" height="30" />
    </clipPath>
    <clipPath id="uk-clip-diag">
      <path d="M0,0 v12 h24 v18 h12 v-18 h24 v-12 h-24 v-18 h-12 v18 z" />
    </clipPath>
  </defs>

  <!-- Blue background -->
  <rect width="60" height="30" fill="#012169" clip-path="url(#uk-clip-border)" />

  <!-- White diagonals -->
  <path
    d="M0,0 L60,30 M60,0 L0,30"
    stroke="#FFFFFF"
    stroke-width="6"
    clip-path="url(#uk-clip-border)"
  />

  <!-- Red diagonals (thinner) -->
  <path
    d="M0,0 L60,30 M60,0 L0,30"
    stroke="#C8102E"
    stroke-width="4"
    clip-path="url(#uk-clip-border)"
  />

  <!-- White cross -->
  <path
    d="M30,0 v30 M0,15 h60"
    stroke="#FFFFFF"
    stroke-width="10"
    clip-path="url(#uk-clip-border)"
  />

  <!-- Red cross -->
  <path
    d="M30,0 v30 M0,15 h60"
    stroke="#C8102E"
    stroke-width="6"
    clip-path="url(#uk-clip-border)"
  />
</svg>

